name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: Run CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate:
    name: Validate release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Install development environment
        run: uv sync --locked --dev
      - name: Set up just
        uses: extractions/setup-just@v4
      - name: Build, install, and smoke-test artifacts
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            just release-check "$GITHUB_REF_NAME"
          else
            just release-check
          fi
      - name: Retain validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI with Trusted Publishing
    needs: [ci, validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/typescope
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
