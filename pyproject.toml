[project]
name = "typescope"
version = "0.0.7"
description = "Runtime type-level assignability check for Python"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{ name = "inaku-Gyan", email = "inaku.gs@gmail.com" }]
keywords = ["runtime type checking", "subtyping"]
classifiers = ["Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]

[project.urls]
Homepage = "https://github.com/inaku-Gyan/typescope"
Issues = "https://github.com/inaku-Gyan/typescope/issues"
Repository = "https://github.com/inaku-Gyan/typescope"

[dependency-groups]
dev = [
  "pyrefly>=1.3.2",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = "tests"

[tool.hatch.build.targets.wheel]
packages = ["src/typescope"]

[tool.hatch.build.targets.sdist]
include = [
  "src/typescope",
  "README.md",
  "LICENSE",
]

[tool.ruff]
# Keep lint and formatting compatible with every supported runtime.
target-version = "py311"
fix = true

[tool.ruff.lint]
# 选择要启用的规则
select = [
  "ANN",  # flake8-annotations - 检查类型注解
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",  # pydocstyle - 文档字符串检查
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat - 隐式字符串连接检查
  "N",  # pep8-naming - 命名约定
  "PL",  # pylint - 部分 Pylint 规则
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in {name}
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D106",  # Missing docstring in public nested class
  "D107",  # Missing docstring in `__init__`
  "D202",  # No blank lines allowed after function docstring (found {num_lines})
  "D203",  # 1 blank line required before class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "D400",  # First line should end with a period
  "D401",  # First line of docstring should be in imperative mood: "{first_line}"
  "D413",  # Missing blank line after last section ("{name}")
  "D415",  # First line should end with a period, question mark, or exclamation point
  "E501",  # Line too long ({width} > {limit})
  "F405",  # {name} may be undefined, or defined from star imports
  "PLR2004",  # Magic value used in comparison, consider replacing {value} with a constant variable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
